spring.application.name=gateway

server.port=8010

#Url of discovery server
eureka.client.serviceUrl.defaultZone=http://discovery:8082/eureka

#Enables automatic mapping to microservices instances
#NB: Spring Cloud Gateway 5.x (2025.x) moved this under .server.webflux.* — the
#legacy spring.cloud.gateway.discovery.locator.* prefix is inert on this version.
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true

#Allows the http request's url to be sent with service's name in lower case
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true


eureka.client.register-with-eureka=false
eureka.client.fetch-registry=true
